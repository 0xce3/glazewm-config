# yaml-language-server: $schema=https://raw.githubusercontent.com/amnweb/yasb/main/schema.json

# Configuration generated by YASB Setup Wizard.
# For more information, visit https://github.com/amnweb/yasb/wiki
watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens:
    - '*'
    class_name: yasb-bar
    alignment:
      position: top
      align: center
    animation:
      enabled: true
      duration: 300
    blur_effect:
      # Disabled so the 85% background transparency actually shows through
      # (acrylic blur made the bar look solid/milky).
      enabled: false
      round_corners: true
      round_corners_type: normal
      border_color: system
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: 100%
      height: 34
    padding:
      top: 4
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - home
      - glazewm_workspaces
      center:
      - clock
      right:
      - jlink_menu
      - jlink_status
      - systray
      - wifi
      - bluetooth
      - battery
      - control_center
widgets:
  battery:
    type: yasb.battery.BatteryWidget
    options:
      label: "<span>{icon}</span> {percent}%"
      label_alt: "<span>{icon}</span> {percent}% | {power}W | {time_remaining}"
      update_interval: 5000
      time_remaining_natural: false
      hide_unsupported: true
      charging_options:
        icon_format: "{charging_icon}"
        blink_charging_icon: true
        blink_interval: 500
      status_thresholds:
        critical: 10
        low: 25
        medium: 75
        high: 95
        full: 100
      status_icons:
        icon_charging: "\uF0E7"
        icon_critical: "\uF244"
        icon_low: "\uF243"
        icon_medium: "\uF242"
        icon_high: "\uF241"
        icon_full: "\uF240"
      callbacks:
        on_left: toggle_label
        on_middle: do_nothing
        on_right: do_nothing
  control_center:
    type: yasb.control_center.ControlCenterWidget
    options:
      label: "<span>\uE713</span>"
      tooltip: true
      sections_order:
      - system_controls
      - quick_actions
      - sliders
      - power
      - media
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        direction: down
        offset_top: 6
        offset_left: 0
      sections:
        system_controls:
          profile_image_size: 28
          settings_icon: "\uE713"
          lock_icon: "\uE72E"
          power_icon: "\uE7E8"
        quick_actions:
          show: true
          columns: 3
          label_position: default
          actions:
          - id: toggle_dnd
            label: Do Not Disturb
            icon: "\uF285"
          - id: toggle_mute
            label: Mute
            icon: "\uE74F"
          - id: toggle_mic_mute
            label: Mic Mute
            icon: "\uF12E"
          - id: screenshot
            label: Screenshot
            icon: "\uE91B"
          - id: touch_keyboard
            label: Keyboard
            icon: "\uE765"
          - id: toggle_theme
            label: Dark Mode
            icon: "\uE708"
        sliders:
          show: true
          brightness:
            show_slider: true
            icon: "\uE706"
            show_source_selector: true
            source_selector_icon: "\uE972"
          volume:
            show_slider: true
            icon: "\uE767"
            show_source_selector: true
            source_selector_icon: "\uE972"
          microphone:
            show_slider: true
            icon: "\uE720"
            show_source_selector: true
            source_selector_icon: "\uE972"
        power:
          show: true
          power_plan_title: Power Plan
          power_mode_title: Power Mode
          button_menu_icon: "\uE76C"
        media:
          show: true
          thumbnail_size: 36
          thumbnail_radius: 4
          icons:
            prev_track: "\uE892"
            next_track: "\uE893"
            play: "\uE768"
            pause: "\uE769"
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: do_nothing
  jlink_status:
    type: yasb.custom.CustomWidget
    options:
      class_name: jlink-status
      label: '{data[label]}'
      label_alt: '{data[status]} - {data[device]}'
      label_placeholder: J-Link
      tooltip: true
      tooltip_label: '{data[status]} | Target: {data[device]} | Remote: {data[remote_port]} | GDB: {data[gdb_port]}'
      exec_options:
        run_cmd: py -3 %USERPROFILE%\.config\yasb\jlink-control.py status
        run_interval: 1000
        return_format: json
        use_shell: true
        encoding: utf-8
      callbacks:
        on_left: toggle_label
        on_middle: do_nothing
        on_right: do_nothing
  jlink_menu:
    type: yasb.home.HomeWidget
    options:
      label: '<span class="jlink-menu-icon">J</span>'
      menu_list:
      - title: Start Remote
        command: powershell.exe
        args:
        - -NoProfile
        - -Command
        - '& (Join-Path $env:SystemRoot ''py.exe'') -3 (Join-Path $env:USERPROFILE ''.config\yasb\jlink-control.py'') start-remote'
      - title: Stop Remote
        command: powershell.exe
        args:
        - -NoProfile
        - -Command
        - '& (Join-Path $env:SystemRoot ''py.exe'') -3 (Join-Path $env:USERPROFILE ''.config\yasb\jlink-control.py'') stop-remote'
      - title: Restart Remote
        command: powershell.exe
        args:
        - -NoProfile
        - -Command
        - '& (Join-Path $env:SystemRoot ''py.exe'') -3 (Join-Path $env:USERPROFILE ''.config\yasb\jlink-control.py'') restart-remote'
      - separator: true
      - title: Start GDB
        command: powershell.exe
        args:
        - -NoProfile
        - -ExecutionPolicy
        - Bypass
        - -Command
        - '& (Join-Path $env:USERPROFILE ''.config\yasb\jlink-target-picker.ps1'')'
      - title: Stop GDB
        command: powershell.exe
        args:
        - -NoProfile
        - -Command
        - '& (Join-Path $env:SystemRoot ''py.exe'') -3 (Join-Path $env:USERPROFILE ''.config\yasb\jlink-control.py'') stop-gdb'
      - title: Restart GDB
        command: powershell.exe
        args:
        - -NoProfile
        - -Command
        - '& (Join-Path $env:SystemRoot ''py.exe'') -3 (Join-Path $env:USERPROFILE ''.config\yasb\jlink-control.py'') restart-gdb'
      - separator: true
      - title: Stop all J-Link servers
        command: powershell.exe
        args:
        - -NoProfile
        - -Command
        - '& (Join-Path $env:SystemRoot ''py.exe'') -3 (Join-Path $env:USERPROFILE ''.config\yasb\jlink-control.py'') stop'
      system_menu: false
      power_menu: false
      blur: true
      round_corners: true
      round_corners_type: small
      border_color: System
      alignment: left
      direction: down
      offset_top: 6
      offset_left: 0
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: do_nothing
  home:
    type: yasb.home.HomeWidget
    options:
      label: "<span>\uE8A9</span>"
      menu_list:
      - title: User Home
        path: '~'
      - title: Download
        path: ~\Downloads
      - title: Documents
        path: ~\Documents
      - title: Pictures
        path: ~\Pictures
      system_menu: true
      power_menu: true
      blur: true
      round_corners: true
      round_corners_type: normal
      border_color: System
      alignment: left
      offset_left: -12
  clock:
    type: yasb.clock.ClockWidget
    options:
      label: '{%a %d.%m.  %H:%M}<span>{alarm}</span>'
      label_alt: '{%H:%M}'
      timezones: []
      calendar:
        blur: true
        round_corners: true
        alignment: center
        direction: down
        extended: false
        show_years: true
        show_holidays: false
        show_week_numbers: true
      callbacks:
        on_left: toggle_calendar
        on_middle: toggle_label
        on_right: context_menu
  volume:
    type: yasb.volume.VolumeWidget
    options:
      label: <span>{icon}</span>
      label_alt: <span>{icon}</span>{level}
      tooltip: true
      icons:
        muted: "\uE74F"
        '10': "\uE992"
        '30': "\uE993"
        '60': "\uE994"
        '100': "\uE995"
      callbacks:
        on_left: toggle_volume_menu
        on_right: toggle_mute
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: system
        alignment: right
        direction: down
        show_apps: true
        show_app_labels: false
        show_app_icons: true
        show_apps_expanded: false
        app_icons:
          toggle_down: "\uE972"
          toggle_up: "\uE971"
  notifications:
    type: yasb.notifications.NotificationsWidget
    options:
      label: "<span>\uF2A5</span>"
      label_alt: '{count} notifications'
      hide_empty: true
      tooltip: false
      callbacks:
        on_left: toggle_notification
        on_right: do_nothing
        on_middle: do_nothing
  power_menu:
    type: yasb.power_menu.PowerMenuWidget
    options:
      label: "<span>\uE712</span>"
      uptime: true
      show_user: true
      menu_style: popup
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: System
        alignment: right
        offset_left: 12
      profile_image_size: 64
      buttons:
        lock:
        - "\uDB80\uDF41"
        - Lock
        signout:
        - "\uDB80\uDF43"
        - Sign out
        sleep:
        - "\uDB82\uDD04"
        - Sleep
        hibernate:
        - "\uDB82\uDD01"
        - Hibernate
        restart:
        - "\uDB81\uDC53"
        - Restart
        shutdown:
        - "\uDB82\uDD06"
        - Shut Down
        cancel:
        - ''
        - Cancel
  wifi:
    type: yasb.wifi.WifiWidget
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span> {wifi_name} ({wifi_strength}%)"
      update_interval: 5000
      callbacks:
        on_left: toggle_label
        on_middle: do_nothing
        on_right: exec cmd /c start ms-settings:network-wifi
      wifi_icons:
      - "󰤯"
      - "󰤟"
      - "󰤢"
      - "󰤥"
      - "󰤨"
  bluetooth:
    type: yasb.bluetooth.BluetoothWidget
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span> {device_count} connected"
      label_no_device: "<span>󰂲</span>"
      label_device_separator: ', '
      icons:
        bluetooth_on: "󰂯"
        bluetooth_off: "󰂲"
        bluetooth_connected: "󰂱"
      callbacks:
        on_left: toggle_label
        on_middle: do_nothing
        on_right: exec cmd /c start ms-settings:bluetooth
  glazewm_workspaces:
    type: glazewm.workspaces.GlazewmWorkspacesWidget
    options:
      hide_if_offline: true
      monitor_exclusive: false
  active_window:
    type: yasb.active_window.ActiveWindowWidget
    options:
      label: '{win[title]}'
      label_alt: '[class_name=''{win[class_name]}'' exe=''{win[process][name]}'' hwnd={win[hwnd]}]'
      label_no_window: ''
      label_icon: true
      label_icon_size: 16
      max_length: 32
      max_length_ellipsis: '...'
      monitor_exclusive: false
  systray:
    type: yasb.systray.SystrayWidget
    options:
      class_name: systray
      label_collapsed: "\uE972"
      label_expanded: "\uE971"
      label_position: right
      pin_click_modifier: ctrl
      show_unpinned: false
      show_battery: false
      show_volume: false
      icon_size: 16
      use_hook: true
      show_in_popup: true
      icons_per_row: 5
      popup:
        blur: true
        round_corners: true
        round_corners_type: normal
        border_color: None
        alignment: center
        direction: down
        offset_top: 6
        offset_left: 0
