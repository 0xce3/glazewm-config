[[mgr.prepend_keymap]]
on   = "<C-p>"
run  = "plugin fzf"
desc = "Find files below current directory"

[[mgr.prepend_keymap]]
on   = [ "g", "d" ]
run  = "cd ~/Downloads"
desc = "Go to Downloads"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Documents"
desc = "Go to Documents"

[[mgr.prepend_keymap]]
on   = [ "g", "u" ]
run  = 'cd "\\\\wsl.localhost\\Ubuntu-26.04"'
desc = "Go to Ubuntu 26.04"

[[mgr.prepend_keymap]]
on   = [ "g", "U" ]
run  = 'cd "\\\\wsl.localhost\\Ubuntu-22.04"'
desc = "Go to Ubuntu 22.04"
